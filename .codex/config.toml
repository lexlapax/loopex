# Destination: .codex/config.toml
#
# Authority loads first from AGENTS.md, then
# docs/developer/agent-context-map.md for routing and version-specific technical guidance.
# This compatibility index only registers Codex-native agent profiles; it
# grants no project or product authority and defines no acceptance rule.

[features]
# Retained smoke evidence proves these project roles with codex-cli 0.147.0;
# keep v2 until a separately reviewed compatibility change proves removal.
multi_agent_v2 = true

[agents.mechanical_worker]
description = "Worker for narrow repeatable scans, inventories, extraction, mechanical transformations, fixture work, and test-log triage."
config_file = "agents/mechanical-worker.toml"

[agents.milestone_worker]
description = "Implementation worker for one bounded milestone workstream with explicit ownership, contracts, and focused verification."
config_file = "agents/milestone-worker.toml"

[agents.release_architect]
description = "Read-only architect for ambiguity involving ownership, durability, authority, security, public contracts, compatibility, and release boundaries."
config_file = "agents/release-architect.toml"

[agents.release_reviewer]
description = "Read-only independent milestone reviewer for correctness, security, plan adherence, test honesty, rollback, and exact-SHA evidence."
config_file = "agents/release-reviewer.toml"
