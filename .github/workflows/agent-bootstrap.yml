name: agent-bootstrap
# Optional hosted mirror only: the repository-owned aggregate command defines
# bootstrap green. Future product gates remain repository commands that any
# hosted provider may invoke; this wrapper must not admit a red seed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  seed-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message check needs history back to its policy baseline.
          fetch-depth: 0
      - run: bash scripts/check-bootstrap.sh
