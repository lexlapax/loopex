name: agent-bootstrap
# Hosted mirror of the repository fast check. The command defines the check;
# this wrapper only supplies a runner, the current toolchain pair and the
# dependencies, and runs it.
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same branch supersedes the run in progress: the older
# bytes are no longer a candidate, and two runs of one pull request at once
# only share the runner's four cores between them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked at its own head, not at the synthetic merge
          # commit GitHub would otherwise check out, whose generated title the
          # commit-message check rejects. Full history reaches the check's baseline.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"
      - run: mix deps.get
      # The provider suite runs with the runner to itself: its child VMs boot
      # under the product's deadline, and on this four-core runner that boot
      # starved behind another application's compile.
      - run: bash scripts/check.sh --select
        env:
          LOOPEX_CHECK_ALONE: loopex_llm_reqllm
